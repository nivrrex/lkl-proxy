# lkl-proxy 外部配置文件，默认路径 /etc/lkl-haproxy/lkl-proxy.conf。
# - 格式 KEY=VALUE，'#' 或 ';' 整行注释；可被 service/lkl-proxy 直接 source。
# - 优先级：环境变量 > 本文件 > proxy/脚本内置默认。
# - proxy 启动参数 --config/-c 或环境变量 $LKL_PROXY_CONFIG 可改路径。
# - 默认值与原 haproxy.cfg 对齐：frontend bind :443，backend 10.0.0.1:443，maxconn 20480。
LISTEN=0.0.0.0:443
BACKEND=10.0.0.1:443
MAXCONN=20480
CONNECT_TIMEOUT_MS=5000
RW_TIMEOUT_MS=50000
